<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aniversário da Catarina 🍎</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 18px 12px;
  background: #fff7f1;
  color: #842331;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 { font-size: 27px; margin: 8px 0; }
p { line-height: 1.5; }

#stage {
  position: relative;
  width: min(100%, 400px);
  aspect-ratio: 3 / 2;
  margin: 18px auto;
  overflow: hidden;
  background: #ead8c5;
}

#video, #frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

#video {
  object-fit: cover;
  transform: scaleX(-1);
}

#frame {
  object-fit: fill;
  pointer-events: none;
}

button, #save {
  display: block;
  width: min(100%, 400px);
  margin: 10px auto;
  padding: 15px;
  border: 0;
  border-radius: 12px;
  background: #b51f32;
  color: white;
  font-size: 17px;
  font-weight: bold;
  text-decoration: none;
  cursor: pointer;
}

button:disabled { opacity: .5; }
#save { background: #287747; display: none; }
#status { min-height: 24px; font-size: 14px; }
</style>
</head>
<body>

<h1>🍎 Aniversário da Catarina 🍎</h1>
<p>Tire sua foto e guarde uma lembrança especial!</p>

<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <img id="frame"
       src="moldura_vertical_catarina_transparente.png"
       alt="Moldura da Catarina">
</div>

<button id="start">📸 Abrir câmera</button>
<button id="take" disabled>❤️ Tirar foto</button>
<button id="again" disabled>🔄 Tirar outra foto</button>
<a id="save">⬇️ Salvar minha foto</a>
<p id="status">Toque em Abrir câmera para começar.</p>

<script>
const video = document.getElementById('video');
const frame = document.getElementById('frame');
const start = document.getElementById('start');
const take = document.getElementById('take');
const again = document.getElementById('again');
const save = document.getElementById('save');
const status = document.getElementById('status');
let stream = null;

frame.onerror = () => {
  status.textContent = 'Não foi possível carregar a moldura. Confira o arquivo no GitHub.';
};

start.onclick = async () => {
  try {
    start.disabled = true;
    status.textContent = 'Abrindo a câmera...';

    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user' },
      audio: false
    });

    video.srcObject = stream;
    await video.play();
    take.disabled = false;
    status.textContent = 'Câmera pronta! Prepare o sorriso ❤️';
  } catch (error) {
    start.disabled = false;
    status.textContent = 'Autorize o acesso à câmera e tente novamente.';
  }
};

take.onclick = async () => {
  if (!video.videoWidth || !frame.complete || !frame.naturalWidth) {
    status.textContent = 'Aguarde a câmera e a moldura carregarem.';
    return;
  }

  const canvas = document.createElement('canvas');
  canvas.width = 1200;
  canvas.height = 800;
  const ctx = canvas.getContext('2d');

  const scale = Math.max(
    canvas.width / video.videoWidth,
    canvas.height / video.videoHeight
  );
  const sw = canvas.width / scale;
  const sh = canvas.height / scale;
  const sx = (video.videoWidth - sw) / 2;
  const sy = (video.videoHeight - sh) / 2;

  ctx.save();
  ctx.translate(canvas.width, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
  ctx.restore();

  ctx.drawImage(frame, 0, 0, canvas.width, canvas.height);

  canvas.toBlob(blob => {
    if (!blob) {
      status.textContent = 'Não foi possível preparar a foto. Tente novamente.';
      return;
    }

    if (save.dataset.url) URL.revokeObjectURL(save.dataset.url);
    const url = URL.createObjectURL(blob);
    save.href = url;
    save.dataset.url = url;
    save.download = 'foto-catarina.png';
    save.style.display = 'block';
    take.disabled = true;
    again.disabled = false;
    status.textContent = 'Foto pronta! Toque em Salvar minha foto.';
  }, 'image/png');
};

again.onclick = () => {
  save.style.display = 'none';
  take.disabled = false;
  again.disabled = true;
  status.textContent = 'Pronto para tirar outra foto!';
};

window.addEventListener('pagehide', () => {
  if (stream) stream.getTracks().forEach(track => track.stop());
});
</script>
</body>
</html>
